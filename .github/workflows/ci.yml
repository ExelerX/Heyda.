name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ios:
        description: Also build the iPhone app
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ios: ${{ inputs.ios == true }}
    # No secrets: pull request code (and everything npm and Gradle run for it) never sees the release signing key.
